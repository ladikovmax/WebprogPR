<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style15_1.css">
    <title>Document</title>
</head>
<body>
    <MARQUEE behavior="alternate" ><p id="row1">Перший рядок</p></MARQUEE>
    <MARQUEE direction="left"><p id="row2">Другий рядок</p></MARQUEE>
    <MARQUEE behavior="slide" direction="right"><p id="row3">Третій рядок</p></MARQUEE>
    <!-- Параметр scrolldelay визначає затримку між кроками в мілісекундах -->
    <MARQUEE scrolldelay="1"><p id="row4">Четвертий рядок</p></MARQUEE>
    <!-- Параметр scrollamount визначає на скільки пікселів текст зсувається за один крок -->
    <MARQUEE scrollamount="9"><p id="row5">П'ятий рядок</p></MARQUEE>
</body>
</html>
