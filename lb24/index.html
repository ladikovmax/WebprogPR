<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 24</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #222;
            background: #f0f2f5;
        }

        main {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            border: 1px solid #dde1ea;
            border-radius: 8px;
            background: #fff;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 26px;
        }

        a {
            display: block;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid #d0d8ff;
            border-radius: 6px;
            color: #274bd8;
            background: #f5f7ff;
            font-weight: bold;
            text-decoration: none;
        }

        .note {
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid #dde1ea;
            border-radius: 6px;
            color: #555;
            background: #fbfcff;
            font-size: 14px;
            line-height: 1.45;
        }
    </style>
</head>

<body>
    <main>
        <h1>Лабораторна робота 24</h1>
        <a href="cdn/index.html">React через CDN</a>
        <p class="note">CRA-версія знаходиться у папці <strong>cra</strong> і запускається командами <strong>npm install</strong>, потім <strong>npm start</strong>.</p>
    </main>
</body>

</html>
