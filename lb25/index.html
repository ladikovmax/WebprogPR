<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 25</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #222;
            background: #eeeeee;
        }

        main {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            border: 2px solid #111;
            background: #fff;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 28px;
        }

        p {
            margin-bottom: 14px;
            color: #555;
            font-size: 15px;
            line-height: 1.45;
        }

        a {
            display: block;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid #2b70c9;
            color: #0b63c5;
            background: #f5f9ff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: underline;
        }

        a:hover {
            color: #d35400;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>Лабораторна робота 25</h1>
        <p>Клієнт-серверна версія на Express має маршрути <strong>/book</strong> і <strong>/film</strong>.</p>
        <a href="book.html">Моя улюблена книга</a>
        <a href="film.html">Мій улюблений фільм</a>
    </main>
</body>

</html>
