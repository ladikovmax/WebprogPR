<!doctype html>
<html lang="uk">
<head>

  <title>Практичне завдання №4</title>

</head>
<body>
  <h1>Практичне завдання №4</h1>

  <form id="dataForm">

    <div>
      <label for="name">Ім’я:</label>

    <div>

    </div>

    <button type="submit">Старт</button>
  </form>
